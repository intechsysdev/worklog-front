<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Finalizar actividad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
a{color:#AF1839}a:hover{color:#751326}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F4; color: #1E1F1D; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column;">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 12px 8px;">
    <a href="Actividad.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #1E1F1D;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700;">Finalizar actividad</h1>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 16px;">
    <section style="background: #FFFFFF; border: 1px solid #E2E2E1; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 17px; font-weight: 600;">Instalación de equipo</span>
      <span style="font-size: 13px; color: #5A5958;">Almacén Norte · OT-1042</span>
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 6px; border-top: 1px solid #EFEFEE;">
        <span style="font-size: 14px; color: #3C3C3B;">08:12 → 09:40</span>
        <span style="font-size: 20px; font-weight: 700;">1 h 28 m</span>
      </div>
    </section>

    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
      <legend style="font-size: 14px; font-weight: 600; margin-bottom: 8px; padding: 0;">Resultado</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <sc-for list="{{results}}" as="r" hint-placeholder-count="3">
          <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.selected}}" style="min-height: 48px; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0 6px; border: {{r.border}}; background: {{r.bg}}; color: {{r.fg}};">{{r.label}}</button>
        </sc-for>
      </div>
    </fieldset>

    <label style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 14px; font-weight: 600;">Observación <span style="font-weight: 400; color: #5A5958;">(opcional)</span></span>
      <textarea rows="3" placeholder="Ej.: Equipo instalado y probado con el cliente." style="border: 1px solid #C9C9C8; border-radius: 12px; padding: 12px; font-family: inherit; font-size: 15px; color: #1E1F1D; background: #FFFFFF; resize: none;"></textarea>
    </label>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 14px; font-weight: 600;">Evidencia</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <button type="button" style="height: 84px; border-radius: 14px; border: 1.5px dashed #868787; background: #FFFFFF; color: #3C3C3B; font-family: inherit; font-size: 14px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Tomar foto</button>
        <button type="button" style="height: 84px; border-radius: 14px; border: 1.5px dashed #868787; background: #FFFFFF; color: #3C3C3B; font-family: inherit; font-size: 14px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17c3-6 5-6 6-2s3 4 5 0 4-3 7 1"></path><path d="M3 21h18"></path></svg>Firma del cliente</button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3C3C3B;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E7A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
      Ubicación capturada · precisión 8 m · 09:40
    </div>

    <div style="flex-grow: 1;"></div>

    <a href="Historial.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; background: #AF1839; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7L10 17l-5-5"></path></svg>Confirmar y finalizar</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { result: 'ok' };
}
renderVals() {
const opts = [
{ id: 'ok', label: 'Completada' },
{ id: 'partial', label: 'Incompleta' },
{ id: 'resched', label: 'Reprogramar' }
];
return {
results: opts.map((o) => {
const sel = this.state.result === o.id;
return Object.assign({}, o, {
selected: sel ? 'true' : 'false',
pick: () => this.setState({ result: o.id }),
border: sel ? '2px solid #AF1839' : '1px solid #C9C9C8',
bg: sel ? '#FBE9EE' : '#FFFFFF',
fg: sel ? '#751326' : '#3C3C3B'
});
})
};
}
}
</script>
</body>
</html>
