<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aviso de fin de turno</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
a{color:#AF1839}a:hover{color:#751326}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F5F4; color: #1E1F1D; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden;">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 12px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div role="img" aria-label="INTECHSYS ONE" style="display: flex; align-items: center; gap: 6px;">
        <img src="/_blob/b50bb62f27c6a12db166982603d31a4b" alt="" style="width: 30px; height: 31px; display: block;">
        <span aria-hidden="true" style="font-size: 27px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; color: #E51E49;">one</span>
      </div>
      <span aria-hidden="true" style="width: 1px; height: 28px; background: #E2E2E1;"></span>
      <span style="display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 15px; font-weight: 700;">WorkLog</span><span style="font-size: 12px; color: #5A5958;">Bitácora de actividades</span></span>
    </div>
    <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 22px; background: #AF1839; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">AM</span>
  </header>

  <main aria-hidden="true" style="display: flex; flex-direction: column; gap: 12px; padding: 8px 20px;">
    <span style="font-size: 13px; font-weight: 600; color: #5A5958;">Actividad en curso</span>
    <div style="background: #FFFFFF; border: 1px solid #E2E2E1; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 20px; font-weight: 700;">Mantenimiento preventivo</span>
      <span style="font-size: 14px; color: #5A5958;">OT [NÚMERO] · desde las 14:10</span>
      <span style="font-size: 34px; font-weight: 700; letter-spacing: -0.02em;">01:35:12</span>
    </div>
  </main>

  <div style="position: absolute; inset: 0; background: rgba(30, 31, 29, 0.55);"></div>

  <section role="alertdialog" aria-labelledby="aviso-t" aria-describedby="aviso-d" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 14px;">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #C9C9C8;"></span>

    <div role="group" aria-label="Tipo de dispositivo" style="display: flex; gap: 6px;">
      <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
        <button type="button" onClick="{{k.pick}}" aria-pressed="{{k.sel}}" style="flex: 1; min-height: 36px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: {{k.border}}; background: {{k.bg}}; color: {{k.fg}};">{{k.label}}</button>
      </sc-for>
    </div>
    <div role="group" aria-label="Momento del aviso" style="display: flex; gap: 6px;">
      <sc-for list="{{moments}}" as="m" hint-placeholder-count="3">
        <button type="button" onClick="{{m.pick}}" aria-pressed="{{m.sel}}" style="flex: 1; min-height: 32px; border-radius: 999px; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; border: {{m.border}}; background: {{m.bg}}; color: {{m.fg}};">{{m.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 14px;">
      <span style="width: 56px; height: 56px; border-radius: 28px; background: {{iconBg}}; color: {{iconFg}}; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; flex-shrink: 0;">{{badge}}</span>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <h1 id="aviso-t" style="margin: 0; font-size: 21px; font-weight: 700; line-height: 26px;">{{title}}</h1>
        <span style="font-size: 14px; color: #5A5958;">Tu turno termina a las 16:00</span>
      </div>
    </div>
    <p id="aviso-d" style="margin: 0; font-size: 15px; line-height: 22px; color: #3C3C3B;">{{body}}</p>

    <sc-if value="{{done}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <a href="Kiosco.dc.html" style="height: 56px; border-radius: 14px; background: #AF1839; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none;">{{doneLabel}}</a>
      </div>
    </sc-if>
    <sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <a href="CerrarJornada.dc.html" style="height: 56px; border-radius: 14px; background: #AF1839; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none;">Cerrar jornada ahora</a>
        <a href="Solicitudes.dc.html" style="height: 52px; border-radius: 14px; border: 1px solid #C9C9C8; color: #3C3C3B; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none;">Pedir horas extra al supervisor</a>
        <a href="Actividad.dc.html" style="height: 44px; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none;">Entendido, seguir trabajando</a>
      </div>
    </sc-if>
    <p style="margin: 0; font-size: 12px; line-height: 17px; color: #5A5958; text-align: center;">{{foot}}</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { kind: 'shared', moment: 15 };
}
renderVals() {
const st = this.state;
const shared = st.kind === 'shared';
const done = st.moment === 0;
const chip = (on) => ({ sel: on ? 'true' : 'false', bg: on ? '#1E1F1D' : '#FFFFFF', fg: on ? '#FFFFFF' : '#3C3C3B', border: on ? '1px solid #1E1F1D' : '1px solid #C9C9C8' });
const what = shared ? 'tu sesión en este dispositivo se cerrará' : 'tus apps de trabajo se ocultarán';
let title, body;
if (done) {
title = shared ? 'Sesión cerrada' : 'Apps de trabajo ocultas';
body = shared ? 'Tu jornada quedó pendiente de cierre para que tu supervisor la revise. El dispositivo vuelve a la pantalla de ingreso de Shared Device.' : 'Tu jornada quedó pendiente de cierre para que tu supervisor la revise. El dispositivo volvió al kiosco «Fuera de jornada».';
} else {
title = (shared ? 'Tu sesión se cerrará en ' : 'Tus apps se ocultarán en ') + st.moment + ' min';
body = 'A las 16:10, después de los 10 minutos de gracia, ' + what + '. Guarda tu trabajo y cierra tu jornada para registrar la hora real de salida.';
}
return {
done: done, notDone: !done,
kinds: [{ id: 'shared', label: 'Dispositivo compartido' }, { id: 'own', label: 'Asignado a mí' }].map((k) => Object.assign({}, k, chip(k.id === st.kind), { pick: () => this.setState({ kind: k.id }) })),
moments: [{ v: 15, label: '15:55 · 15 min' }, { v: 5, label: '16:05 · 5 min' }, { v: 0, label: '16:10 · cierre' }].map((m) => Object.assign({}, m, chip(m.v === st.moment), { pick: () => this.setState({ moment: m.v }) })),
badge: done ? '✓' : String(st.moment),
iconBg: done ? '#E8E8E7' : (st.moment <= 5 ? '#FBE9EE' : '#FEF3DA'),
iconFg: done ? '#3C3C3B' : (st.moment <= 5 ? '#751326' : '#8A4105'),
title: title, body: body,
doneLabel: shared ? 'Volver al ingreso' : 'Ver kiosco',
foot: done ? 'MobiControl aplicó el cambio a las 16:10. Queda en Auditoría.' : 'Aviso enviado por WorkLog y por MobiControl. Si tienes horas extra autorizadas, el cierre se corre hasta su fin.'
};
}
}
</script>
</body>
</html>
