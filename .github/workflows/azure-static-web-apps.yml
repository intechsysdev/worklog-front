# Despliegue del panel de WorkLog a Azure Static Web Apps (mismo patrón que one-front, jolly-tree):
# la compilación y el lint corren aquí y Static Web Apps solo sube dist/ (skip_app_build).
#
# Las URLs salen de .env.production, que viaja al repositorio.
#
# Antes del primer despliegue, en Settings → Secrets and variables → Actions del repositorio:
#   - Secreto  AZURE_STATIC_WEB_APPS_API_TOKEN_WORKLOG: token de despliegue del recurso Static Web App.
# Además, la URL {origen del panel}/sso/callback debe estar registrada en ONE para el client_id "worklog".

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # El build se hace aquí (no en Oryx) para controlar la versión de Node.
        run: npm run build

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WORKLOG }}
          action: "upload"
          # Con skip_app_build el contenido a subir es app_location (la salida de Vite).
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WORKLOG }}
          action: "close"
